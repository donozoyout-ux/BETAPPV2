services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: betapp
      POSTGRES_USER: betapp
      POSTGRES_PASSWORD: betapp
    ports:
      - "5432:5432"
    volumes:
      - betapp_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betapp -d betapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres_test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: betapp_test
      POSTGRES_USER: betapp_test
      POSTGRES_PASSWORD: betapp_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betapp_test -d betapp_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    environment:
      DATABASE_URL: postgresql://betapp:betapp@postgres:5432/betapp
      DATABASE_SSL: "false"
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgresql://betapp:betapp@postgres:5432/betapp
      DATABASE_SSL: "false"
      COLLECTOR_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  betapp_postgres:
