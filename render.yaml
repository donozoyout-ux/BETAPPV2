services:
  - type: web
    name: betapp-v2-web
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: node dist/db/migrate.js
    healthCheckPath: /health
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: betapp-v2-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: DB_POOL_MAX
        value: "10"
      - key: DB_CONNECT_TIMEOUT
        value: "5000"
      - key: BACKFILL_ENABLED
        value: "false"
      - key: API_FOOTBALL_ENABLED
        value: "false"
      - key: API_FOOTBALL_KEY
        sync: false
      - key: FOTMOB_ENABLED
        value: "true"
      - key: NOWGOAL_ENABLED
        value: "true"
      - key: NOWGOAL_FUTURE_DAYS
        value: "3"
      - key: NOWGOAL_COMPANY_IDS
        value: 2,3,4,14,15,22,136
      - key: NOWGOAL_BASE_URL
        value: https://nowgoal816.com/wp-json/sport-theme-plugin/v1/proxy
      - key: SUPPORTED_COMPETITIONS
        value: PremierLeague,LaLiga,Bundesliga,SerieA,Ligue1,SuperLig,ChampionsLeague,EuropaLeague,ConferenceLeague,BrasileiraoSerieA,WorldCup,EURO,EUROQualification,UefaNationsLeagueA,UefaNationsLeagueB,UefaNationsLeagueC,UefaNationsLeagueD,WorldCupQualificationUEFA,CopaAmerica,WorldCupQualificationCONMEBOL,InternationalFriendlies,Eredivisie,BelgianProLeague,DanishSuperliga,Allsvenskan,GreekSuperLeague

  - type: worker
    name: betapp-v2-collector
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node dist/worker.js
    preDeployCommand: node dist/db/migrate.js
    maxShutdownDelaySeconds: 60
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: betapp-v2-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DB_POOL_MAX
        value: "8"
      - key: DB_CONNECT_TIMEOUT
        value: "5000"
      - key: COLLECTOR_ENABLED
        value: "true"
      - key: BACKFILL_ENABLED
        value: "true"
      - key: COMPETITION_BACKFILL_AUTO_ENABLED
        value: "true"
      - key: COMPETITION_BACKFILL_AUTO_SEASONS
        value: "1"
      - key: COMPETITION_BACKFILL_AUTO_INTERVAL_MS
        value: "900000"
      - key: PUBLIC_CSV_IMPORT_ENABLED
        value: "false"
      - key: PUBLIC_CSV_IMPORT_BASE_URL
        value: https://football-data.co.uk
      - key: PUBLIC_CSV_IMPORT_SEASONS
        value: 2627,2526,2425
      - key: PUBLIC_CSV_IMPORT_BATCH_SIZE
        value: "100"
      - key: PUBLIC_CSV_IMPORT_INTERVAL_MS
        value: "600000"
      - key: PUBLIC_CSV_CURRENT_REFRESH_MS
        value: "43200000"
      - key: OPENFOOTBALL_IMPORT_ENABLED
        value: "true"
      - key: OPENFOOTBALL_BASE_URL
        value: https://raw.githubusercontent.com/openfootball/football.json/master
      - key: OPENFOOTBALL_IMPORT_SEASONS
        value: 2026-27,2025-26,2024-25
      - key: OPENFOOTBALL_BATCH_SIZE
        value: "150"
      - key: OPENFOOTBALL_INTERVAL_MS
        value: "600000"
      - key: OPENFOOTBALL_CURRENT_REFRESH_MS
        value: "86400000"
      - key: API_FOOTBALL_ENABLED
        value: "false"
      - key: API_FOOTBALL_KEY
        sync: false
      - key: API_FOOTBALL_PREMATCH_ODDS_ENABLED
        value: "true"
      - key: API_FOOTBALL_PREMATCH_INTERVAL_MS
        value: "10800000"
      - key: API_FOOTBALL_PREMATCH_FUTURE_DAYS
        value: "1"
      - key: API_FOOTBALL_PREMATCH_MAX_FIXTURES
        value: "4"
      - key: FOTMOB_ENABLED
        value: "true"
      - key: NOWGOAL_ENABLED
        value: "true"
      - key: NOWGOAL_FUTURE_DAYS
        value: "3"
      - key: NOWGOAL_COMPANY_IDS
        value: 2,3,4,14,15,22,136
      - key: NOWGOAL_BASE_URL
        value: https://nowgoal816.com/wp-json/sport-theme-plugin/v1/proxy
      - key: SUPPORTED_COMPETITIONS
        value: PremierLeague,LaLiga,Bundesliga,SerieA,Ligue1,SuperLig,ChampionsLeague,EuropaLeague,ConferenceLeague,BrasileiraoSerieA,WorldCup,EURO,EUROQualification,UefaNationsLeagueA,UefaNationsLeagueB,UefaNationsLeagueC,UefaNationsLeagueD,WorldCupQualificationUEFA,CopaAmerica,WorldCupQualificationCONMEBOL,InternationalFriendlies,Eredivisie,BelgianProLeague,DanishSuperliga,Allsvenskan,GreekSuperLeague
      - key: COLLECTOR_INTERVAL_MS
        value: "900000"
      - key: COLLECTOR_HISTORY_DAYS
        value: "2"
      - key: COLLECTOR_FUTURE_DAYS
        value: "14"
      - key: PROVIDER_REQUESTS_PER_SECOND
        value: "2"
      - key: PROVIDER_TIMEOUT_MS
        value: "10000"
      - key: PROVIDER_MAX_RETRIES
        value: "4"

databases:
  - name: betapp-v2-postgres
    databaseName: betapp_v2
    user: betapp
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    storageAutoscalingEnabled: true
    ipAllowList: []
  - name: betapp-v2-test-postgres
    databaseName: betapp_v2_test
    user: betapp_test
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    storageAutoscalingEnabled: true
    ipAllowList: []
