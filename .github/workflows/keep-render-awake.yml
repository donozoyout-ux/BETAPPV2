name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping BETAPP health endpoint
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --retry-delay 5 \
            --max-time 90 \
            "https://betappv2.onrender.com/health?keepalive=${GITHUB_RUN_ID}"
