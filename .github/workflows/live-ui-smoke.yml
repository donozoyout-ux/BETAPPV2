name: Live Human Mode Smoke Check

on:
  push:
    branches:
      - chore/live-ui-smoke-20260926

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live Gate Inspector Human Mode
        shell: bash
        run: |
          set -euo pipefail

          ROOT="https://betappv2.onrender.com"
          dash="$(mktemp)"
          detail="$(mktemp)"

          dash_code="$(curl -L -sS -o "$dash" -w '%{http_code}' --connect-timeout 20 --max-time 90 "$ROOT/api/dashboard" || true)"
          echo "DASHBOARD_HTTP=$dash_code"
          test "$dash_code" = "200"

          match_id="$(jq -r '(.predictionPreviews // [])[0] | (.match_id // .matchId // empty)' "$dash")"
          if [[ -z "$match_id" ]]; then
            match_id="$(jq -r '(.matches // [])[0] | (.match_id // .matchId // .id // empty)' "$dash")"
          fi
          echo "MATCH_ID=$match_id"
          test -n "$match_id"

          human_ready="false"
          for attempt in 1 2 3 4 5 6 7 8; do
            detail_code="$(curl -L -sS -o "$detail" -w '%{http_code}' --connect-timeout 20 --max-time 90 "$ROOT/matches/$match_id" || true)"
            echo "DETAIL_HTTP=$detail_code attempt=$attempt/8"
            if [[ "$detail_code" == "200" ]]               && grep -Fq "Neden henüz resmi tahmin yok?" "$detail"               && grep -Fq "Şimdi ne olacak?" "$detail"               && grep -Fq "Teknik detayları göster" "$detail"               && grep -Fq "tahmin güveni veya kazanma olasılığı değildir" "$detail"; then
              human_ready="true"
              break
            fi
            echo "Human Mode markers not present yet."
            sleep 20
          done

          if [[ "$human_ready" != "true" ]]; then
            echo "LIVE_HUMAN_MODE=FAIL"
            exit 2
          fi

          echo "LIVE_HUMAN_MODE=PASS"
